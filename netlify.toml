[build]
  base = "portfolio/client"
  command = "npm --prefix ../backend install && npm run build"
  publish = "dist"

[functions]
  directory = "../backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true