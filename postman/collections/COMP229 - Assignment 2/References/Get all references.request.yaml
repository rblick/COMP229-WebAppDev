$kind: http-request
url: http://localhost:3000/api/references
method: GET
scripts:
  - type: afterResponse
    code: "let jsonData = pm.response.json();\r

      let index = jsonData.data.length - 1;\r

      pm.environment.set(\"referenceId\", jsonData.data[index].id);"
    language: text/javascript
order: 2000
